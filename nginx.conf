server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routes (e.g. /Details, /Register) -
    # fall back to index.html so a hard refresh / direct link works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
